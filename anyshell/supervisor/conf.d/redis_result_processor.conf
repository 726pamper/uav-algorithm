[program:redis_result_processor]
command=/usr/bin/python3 /tensorrt/uav-algorithm-pipeline/redis_result_processor.py
directory=/tensorrt/uav-algorithm-pipeline/
autostart=true
autorestart=true
startsecs=3
stderr_logfile=/var/log/redis_result_processor.err.log
stdout_logfile=/var/log/redis_result_processor.out.log
environment=DASHSCOPE_API_KEY="sk-your-dashscope-api-key"
